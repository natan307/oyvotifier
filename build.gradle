import org.apache.tools.ant.filters.ReplaceTokens

allprojects {
    group 'com.vexsoftware'
    version '1.0.1'
}

subprojects {
    apply plugin: 'java'

    // Bukkit (Spigot API 1.21) and Velocity (API 3.4) need Java 17+.
    // The shared modules and BungeeCord/Waterfall stay on Java 8 bytecode so older proxy JVMs still load the plugin.
    def jdk = (project.name in ['oyvotifier-bukkit', 'oyvotifier-velocity', 'oyvotifier-universal']) ? 17 : 8
    java {
        sourceCompatibility = JavaVersion.toVersion(jdk)
        targetCompatibility = JavaVersion.toVersion(jdk)
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = jdk
    }

    repositories {
        mavenCentral()
        maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://repo.papermc.io/repository/maven-public/" }
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
        testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.2"
        testImplementation "org.mockito:mockito-core:5.11.0"
    }

    processResources {
        filter(ReplaceTokens, tokens: ["app.version": this.project.version.toString()])
    }

    test {
        useJUnitPlatform()
    }
}
